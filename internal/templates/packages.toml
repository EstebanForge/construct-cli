# Construct User-Defined Packages Configuration
#
# BAKED BASELINE (2026-09-21): the standard dev toolset is baked INTO the
# image (internal/templates/Dockerfile) — [apt] system packages, the full
# [brew] tier (all languages/linters/web tools/php@8.x + pcov), jekyll,
# litellm, @tobilu/qmd, bun, mise, asdf, and the core agents
# (claude, codex, agy, pi, opencode at /usr/local/bin).
# Entries BELOW are the OPTIONAL/USER-OVERRIDE layer: everything listed
# installs at guest init into the home bind and SHADOWS its baked
# equivalent by PATH. Remove the entry (and the bind copy) to fall back
# to the baked version.

# System-level Debian packages (installed via apt-get)
# Standard editors/multiplexer are baked. Add extras here:
[apt]
packages = []

# Homebrew packages and taps
# The curated baseline is BAKED (Dockerfile step 3). Add only NEW packages
# here — they install at guest init into the brew prefix and shadow the
# baked set. Taps stay (fast no-ops when already added; needed for user
# additions like further shivammathur extensions).
[brew]
taps = [
  "shivammathur/extensions",  # PHP extensions (required for pcov)
  "shivammathur/php",  # PHP versions (php@8.x)
  "EstebanForge/tap",
]
packages = []

# Rust tools installed via Cargo
[cargo]
packages = [
]

# Global Bun packages
# bun binary is baked (/usr/local/bin); globals land in ~/.bun (user tier).
[bun]
packages = []

# Global Node.js packages
# Baked core agents live at /usr/local/bin (claude, codex, agy, pi,
# opencode) — listing them here would shadow them with bind copies.
# Optional agents only:
[npm]
packages = [
  "@qwen-code/qwen-code@latest",
  "@github/copilot",
  "@charmland/crush",
  "cline",
  "@kilocode/cli",
  "agent-browser",
  "url-to-markdown-cli-tool",
  "sass",
  "hunkdiff",
]

# Pi extension packages (installed via `pi install`, NOT global npm).
# Sources use pi's syntax: npm:name, git:github.com/user/repo, url, or local path.
# pi manages its own local tree (~/.pi/agent/npm) and settings.json atomically;
# pi install is idempotent so re-running `ct sys packages --install` is safe.
[pi]
packages = [
  # "npm:@estebanforge/pi-agentmemory",
  # "npm:pi-unified-exec",
  # "git:github.com/jnsahaj/pi-agent-browser-screenshot",
]

# Python packages (pipx/uv-backed; baked: litellm)
[pip]
packages = []

# Ruby gems (baked: jekyll)
[gems]
packages = []

# Specialized tools and version managers
# Set to true to enable installation
[tools]
asdf = true
mise = true
nix = false
nvm = false
phpbrew = false
vmr = false
volta = false

# Commands to run after all package managers finish
[post_install]
commands = [
  "if [ \"$(uname -m)\" = \"aarch64\" ] || [ \"$(uname -m)\" = \"arm64\" ]; then echo \"ℹ️ ARM64 detected: Configuring agent-browser to use system Chromium\"; mkdir -p ~/.local/bin; printf '#!/bin/bash\\nexec \"'\"$(npm config get prefix)\"'\"/bin/agent-browser --executable-path /usr/bin/chromium \"$@\"' > ~/.local/bin/agent-browser && chmod +x ~/.local/bin/agent-browser; else agent-browser install --with-deps; fi",
  "if command -v goose &>/dev/null; then echo \"Goose already installed\"; else curl -fsSL https://github.com/aaif-goose/goose/releases/download/stable/download_cli.sh | CONFIGURE=false bash; fi",
  "if [ -x \"$HOME/.local/bin/droid\" ]; then echo \"Droid already installed\"; else curl -fsSL https://app.factory.ai/cli | sh; fi",
  "if [ -x \"$HOME/.phpvm/bin/phpvm\" ]; then echo \"phpvm already installed\"; else curl -o- https://raw.githubusercontent.com/Thavarshan/phpvm/main/install.sh | bash; fi",
  # Obscura: Rust headless browser engine for AI agents (V8 + CDP, Puppeteer/Playwright/MCP).
  # Binary on PATH only, NOT an agent (no agent.go/memories.go registration). Keep worker next to binary.
  # Linux-only tarball (Construct sandboxes are Debian). Pinned to v0.1.9; bump deliberately when a new release is vetted.
  "if [ -x \"$HOME/.local/bin/obscura\" ]; then echo \"Obscura already installed\"; else case \"$(uname -m)\" in aarch64|arm64) ARCH=aarch64;; *) ARCH=x86_64;; esac; curl -fsSL -o /tmp/obscura.tar.gz \"https://github.com/h4ckf0r0day/obscura/releases/download/v0.1.9/obscura-${ARCH}-linux.tar.gz\" && mkdir -p \"$HOME/.local/bin\" && tar xzf /tmp/obscura.tar.gz -C \"$HOME/.local/bin\" obscura obscura-worker && chmod +x \"$HOME/.local/bin/obscura\" \"$HOME/.local/bin/obscura-worker\" && rm -f /tmp/obscura.tar.gz && echo \"Obscura installed\"; fi",
]
