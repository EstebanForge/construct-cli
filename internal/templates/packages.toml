# Construct User-Defined Packages Configuration
#
# BAKED BASELINE (brew exited - see docs/BREW-EXIT.md): the
# standard dev toolset is baked INTO the image (internal/templates/Dockerfile)
# — [apt] system packages + dev tools (awscli, podman, ffmpeg, hugo...),
# vendor-repo gh/nodejs 24, the mise github: tier (yq, topgrade, git-cliff,
# zola, tlrc, rtk, mcp-cli-ent, md-over-here), jekyll, litellm, bun, mise,
# asdf, and the core agents (claude, codex, agy, pi, pig, opencode at /usr/local/bin).
# Language toolchains (Go, Rust, Java, PHP, etc.) are modular OCI artifacts
# mounted on-demand via internal/toolchains.
# Entries BELOW are the OPTIONAL/USER-OVERRIDE layer: everything listed
# installs at guest init into the home bind and SHADOWS its baked
# equivalent by PATH. Remove the entry (and the bind copy) to fall back
# to the baked version.

# System-level Debian packages (installed via apt-get)
# Standard editors/multiplexer are baked. Add extras here:
[apt]
packages = []

# mise tools (language runtimes and GitHub-release binaries).
# Installed as `mise use -g <entry>`; entries use mise syntax: "node@24",
# "zig@0.14", "github:owner/repo@v1.2.3". Installs land in the home bind
# (~/.local/share/mise) and shadow baked equivalents by PATH. Kotlin,
# scala, groovy, gradle are intentionally NOT baked - add them here
# to fetch on demand:
[mise]
packages = []

# Rust tools installed via Cargo
[cargo]
packages = [
]

# Global Bun packages
# bun binary is baked (/usr/local/bin); globals land in ~/.bun (user tier).
[bun]
packages = []

# Global Node.js packages
# Baked tools live at /usr/local (core agents, copilot, agent-browser,
# url-to-markdown, sass, hunkdiff, prettier, typescript, vite, webpack).
# Optional tools and agents (uncomment or add to enable):
#   "@qwen-code/qwen-code@latest",
#   "@charmland/crush",
#   "cline",
#   "@kilocode/cli",
[npm]
packages = []

# Pi extension packages (installed via `pi install`, NOT global npm).
# Sources use pi's syntax: npm:name, git:github.com/user/repo, url, or local path.
# pi manages its own local tree (~/.pi/agent/npm) and settings.json atomically;
# pi install is idempotent so re-running `ct sys packages install` is safe.
[pi]
packages = [
  # "npm:@estebanforge/pi-agentmemory",
  # "npm:pi-unified-exec",
  # "git:github.com/jnsahaj/pi-agent-browser-screenshot",
]

# Python packages (pipx/uv-backed; baked: litellm)
[pip]
packages = []

# Ruby gems (baked: jekyll)
[gems]
packages = []

# Specialized tools and version managers
# Set to true to enable installation
[tools]
asdf = true
mise = true
nix = false
nvm = false
phpbrew = false
vmr = false
volta = false

# Commands to run after all package managers finish.
# Baseline tools (amp, goose, droid, obscura, agent-browser) are baked into
# the base image. Add custom user setup commands here:
[post_install]
commands = [
  # "if [ -x \"$HOME/.phpvm/bin/phpvm\" ]; then echo \"phpvm already installed\"; else curl -o- https://raw.githubusercontent.com/Thavarshan/phpvm/main/install.sh | bash; fi",
]
