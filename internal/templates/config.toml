# Construct CLI Configuration File
# Path: ~/.config/construct-cli/config.toml
# Documentation: https://github.com/EstebanForge/construct-cli

# Runtime Preferences
[runtime]
# Isolation backend: "auto" (default; detects container > podman > docker), or pin a specific
# OCI runtime ("container", "podman", "docker"), or "microvm" (microsandbox microVMs,
# experimental).
# With "microvm": use the daemon and set [daemon] multi_paths_enabled + mount_paths to cover
# your project roots. The daemon sandbox is then created once and reused across projects;
# without it, switching project roots recreates the sandbox and re-runs guest initialization
# (first boot takes minutes).
# backend = "auto"

# Automatically check for updates once per day (true/false)
auto_update_check = true

# Update check interval in seconds (default: 86400 = 24 hours)
update_check_interval = 86400

# Update channel: "stable" (default) or "beta"
# "beta" lets selected machines receive pre-release updates only.
update_channel = "stable"

# Phase 4: when true, `construct update` and first-run init spawn a detached
# `msb pull` of construct-box:latest so the next ct invocation finds the
# image already staged. Output goes to ~/.config/construct-cli/logs/prepull.log.
# Set false on a metered link or when you want to manage image pulls
# manually. Default true.
prepull_image = true

# Sandbox Settings
[sandbox]
# Mount the entire home directory? (Dangerous, default: false)
mount_home = false

# Allow mounting host $HOME as /workspace under microvm backend? (Dangerous, default: false)
# virtiofs has no exclusion filter; recursive scans across $HOME can freeze the microVM.
allow_home_workspace = false

# Max file entries scanned in workspace before confirmation prompt (default: 60000)
workspace_max_entries = 60000

# Forward host SSH agent into the container (default: true)
forward_ssh_agent = true

# Pin SSH identities per host (default: none). Accepts MORE THAN ONE entry.
# When the forwarded agent holds many keys, ssh offers all of them and the
# server can reject the connection with "Too many authentication failures"
# (sshd MaxAuthTries) before the right key is tried. Pinning forces ssh to offer
# only the named key for that host.
# keyname is a file in the container ~/.ssh:
#   - with a forwarded agent, drop ~/.ssh/<keyname>.pub (the public key) to
#     select the matching agent key
#   - without an agent, ~/.ssh/<keyname> (the private key file) is used
# Two entry forms:
#   "host=keyname"            pin keyname for host
#   "alias=hostname=keyname"  pin keyname for an alias (same service, many
#                             accounts); use the alias in your remote URL
# Examples:
#   # One key per service:
#   ssh_pin_identities = ["github.com=github", "gitlab.com=work"]
#   # Two GitHub accounts (remotes: git@github-work:... / git@github-personal:...):
#   ssh_pin_identities = ["github-work=github.com=work", "github-personal=github.com=personal"]
ssh_pin_identities = []

# Sync host git name/email into container (default: true)
propagate_git_identity = true

# Enforce strict non-root runtime behavior by forcing container user mapping (default: false)
# WARNING: On Docker this can break first-run package installs (Homebrew/npm permission issues)
# because root bootstrap permission-fixes are bypassed.
# Enable only for strict compliance environments where non-root is mandatory.
non_root_strict = false

# Allow manual customizations in docker-compose.override.yml (default: false)
# Advanced: when enabled, Construct will not auto-heal manual 'user:' override mappings.
# Use only if you intentionally maintain your own override behavior.
allow_custom_compose_override = false

# Disable the container seccomp filter (default: false)
# Enables headless browser automation (Chrome/Chromium via agent-browser, Playwright,
# CDP). Docker's default seccomp profile blocks syscalls these tools need
# (clone3 with namespace flags, seccomp BPF install, ptrace), causing browser
# launches to crash. Opt-in only; removing seccomp reduces a kernel-level
# isolation layer. See docs/SECURITY.md for the tradeoff.
# NOTE: this flag is auto-managed. If you also set allow_custom_compose_override = true
# and hand-edit security_opt in docker-compose.override.yml, toggling this flag
# (or any other hash input) regenerates the override and overwrites your manual entry.
disable_seccomp = false

# Run agent exec sessions as host UID:GID on Linux Docker (default: true)
# Purpose: preserve host file ownership for files written by agents.
# This applies to exec paths (daemon + attach), while keeping startup root-bootstrap intact.
# If host UID is not present in container /etc/passwd, Construct keeps host UID:GID mapping and forces HOME=/home/construct.
# Run agent exec sessions as host UID:GID on Linux Docker (default: true)
# Purpose: preserve host file ownership for files written by agents.
# This applies to exec paths (daemon + attach), while keeping startup root-bootstrap intact.
# If host UID is not present in container /etc/passwd, Construct keeps host UID:GID mapping and forces HOME=/home/construct.
exec_as_host_user = true

# Binaries the agent can invoke that actually run on the HOST machine instead of in-container.
# The agent sees them on PATH and calls them normally; a shim proxies each call to a host-side
# bridge that runs the real binary as your host user and streams stdout/stderr back.
#
# WARNING: each listed binary runs on the host with FULL container-controlled argv. Only list
# binaries you trust with that. Declaring e.g. "docker" grants effective host root to the agent;
# "aws"/"kubectl" likewise. The bridge is token-gated and allowlist-pinned, but argv is not filtered.
# Off when empty (feature disabled, no bridge started). Requires `construct build` after first set
# so the container shim is baked into the image. See docs/HOST-EXEC.md.
# host_binaries = ["wicket"]
# Explicit host env vars to pass through into Construct unchanged.
# Default passthroughs cover common CLI/tool auth use cases.
env_passthrough = [
    "GITHUB_TOKEN",
    "CONTEXT7_API_KEY",
    "BRAVE_API_KEY",
    "OPENAI_API_KEY",
    "ANTHROPIC_API_KEY",
    "GEMINI_API_KEY",
    "ANTIGRAVITY_API_KEY",
    "QWEN_API_KEY",
    "DEEPSEEK_API_KEY",
    "MINIMAX_API_KEY",
    "KIMI_API_KEY",
    "ZAI_API_KEY",
    "MIMO_API_KEY",
    "OPENCODE_API_KEY",
    "PI_CACHE_RETENTION",
]

# Host env prefixes to auto-pass into Construct after stripping the prefix.
# Example: host CNSTR_CONTEXT7_API_KEY=... becomes CONTEXT7_API_KEY inside Construct.
# Explicit env_passthrough values win if both sources target the same inside key.
env_passthrough_prefixes = ["CNSTR_"]

# Terminal-identity markers (KITTY_WINDOW_ID, GHOSTTY_RESOURCES_DIR, TERM_PROGRAM)
# are forwarded automatically so in-container TUIs and pi extensions can detect
# the outer terminal (e.g. kitty-graphics inline image rendering). TERM itself
# is NOT forwarded by default to avoid terminfo mismatches; add it here and
# install ncurses-term/kitty-terminfo in the image if you need it.

# SELinux mount labels on Linux: "auto" | "enabled" | "disabled"
selinux_labels = "auto"

# Default shell inside the container
shell = "/bin/bash"

# Hostname for the host clipboard bridge
clipboard_host = "host.docker.internal"

# Host service environment variables (injected into container, localhost → host.docker.internal)
# Format: "VAR_NAME=http://localhost:PORT" — localhost/127.0.0.1 is auto-rewritten to host.docker.internal.
# Other hosts (LAN IP, DNS name) pass through unchanged; use a container-routable address when
# the host value is a host-only name (e.g. mDNS) that does not resolve inside the sandbox.
# Unlike env_passthrough (injected per agent launch), these are baked into the daemon container
# at creation. Changing a value requires `construct sys daemon restart` to take effect.
# See docs/CONFIGURATION.md -> Host Service Bridging.
# Uncomment to bridge host services into the sandbox.
host_service_env = [
    # "AGENTMEMORY_URL=http://localhost:3111",
]

# Container loopback ports relayed to host.docker.internal (same port both sides).
# Chromium hardcodes *.localhost and localhost to 127.0.0.1 (RFC 6761), bypassing
# /etc/hosts and DNS, so a DNS-layer fix cannot reach host dev sites from a browser.
# These socat forwards listen on the container's 127.0.0.1 and blindly relay TCP to
# host.docker.internal, preserving the HTTP Host header and TLS SNI so host vhost
# routers (valet/Hyperpress) and certs see the real hostname. HTTP and HTTPS on the
# standard ports work out of the box; add non-standard ports (e.g. 3000) as needed.
# Linux caveat: host services must bind 0.0.0.0/bridge (not 127.0.0.1-only) to be
# reachable via host-gateway. Empty list disables the feature (no NET_BIND_SERVICE cap).
host_loopback_ports = [80, 443]

# Mount the host skills library into each supported agent's skills directory inside
# the sandbox (default: true). This bind-mounts the host source into /home/construct/<agent>/skills
# for every agent that has a known skills path, so users no longer need to run a
# separate sync step (e.g. manage.sh link) to duplicate skills into the sandbox.
# Source resolution order (first non-empty wins):
#   1. $CONSTRUCT_SKILLS_SOURCE environment variable
#   2. [sandbox] skills_source below (if non-empty)
#   3. Auto-detect, first existing:
#        ~/Dev/EstebanForge/AGENTS/skills
#        ~/AGENTS/skills
#        ~/.config/construct-cli/skills
#        $XDG_DATA_HOME/construct/skills
#   4. None found: no mount, no error. The feature is opt-out by silent absence.
# Set to false to disable entirely and rely on a pre-sync step (legacy behavior).
# See docs/VMsv2.md (phase 7) and docs/CONFIGURATION.md.
mount_skills = true
# Skills mount mode (default: true = read-only). The mount uses `:ro` so the
# agent inside the sandbox cannot modify the host skills source; this is the
# safe default — agents consume skills, they do not author them. Opt into
# read-write by setting this to false ONLY when you want agents to author or
# edit skills (writes flow back to the host; trust bound matches the
# persistent home bind). See docs/SECURITY.md when that doc gains a
# filesystem-exposure section.
skills_read_only = true
# Override the host skills source path. Empty (default) triggers auto-detect.
# Useful for CI runners, multi-machine setups, or when the canonical agent-forge
# layout is not where your skills live. Env var $CONSTRUCT_SKILLS_SOURCE wins.
# skills_source = ""

# Agent Behavior
[agents]
# Enable yolo mode for all supported agents (default: false, overrides yolo_agents)
yolo_all = false

# Enable yolo mode for specific agents (slugs), e.g. ["claude", "agy"]
# Supported: claude, agy, codex, qwen, copilot, cline, kilocode, crush
yolo_agents = []

# Patch clipboard integrations for JS/NPM agents and install PTY clipboard wrappers
# for Copilot/Codex image paste support (default: true).
clipboard_image_patch = true

# Daemon Settings
[daemon]
# Auto-start the daemon on first agent run for faster subsequent startups (default: true)
auto_start = true

# Enable multi-root daemon mounts (advanced, default: false)
# Purpose: allow the daemon to serve runs from multiple host roots, not just the current repo.
# Benefits: faster agent startups across different projects without restarting the daemon.
# Recommended with backend = "microvm": the microVM daemon sandbox is created once and reused
# for every project under these roots; without it, switching project roots recreates the
# sandbox (guest state resets, first boot takes minutes).
multi_paths_enabled = false

# Host directories the daemon can serve (used only when multi_paths_enabled=true)
# Supports "~" home expansion, e.g. ["~/Dev/Projects", "/work/client-repos"]
mount_paths = []

# LRU cap on learned roots (phase 2). The daemon auto-learns a new host
# root the first time it serves a project there (interactive prompt only).
# When the cap is exceeded, the least-recently-used learned root is
# evicted, the daemon recreates with the smaller set, and one notice is
# printed. 0 disables learning entirely. Default 8.
max_learned_roots = 8

# Phase 3: stop the daemon after this many minutes of zero live sessions
# (default 45). On the last unregister, a detached `construct sys daemon
# idle-watch` is spawned; it rechecks the session registry every 30s and
# stops the daemon if the count is still zero at the deadline. A new ct
# invocation that registers a session during the sleep stands the watcher
# down. Bridges (SSH proxy, clipboard, host exec, herdr) die with the
# daemon, so idle = smaller host attack surface. 0 disables idle stop
# entirely (the daemon runs until manually stopped).
idle_stop_minutes = 45

# Network Isolation (Optional)
[network]
# Mode: "permissive" (default), "strict" (block all except allowed), "offline" (no network)
mode = "permissive"

# Domain allowlist (supports wildcards)
allowed_domains = [
    "*.anthropic.com",
    "*.openai.com",
    "*.googleapis.com",
    "api.z.ai"
]

# IP/CIDR allowlist
allowed_ips = [
    "1.1.1.1/32",     # Cloudflare DNS
    "8.8.8.8/32"      # Google DNS
]

# Domain blocklist (takes precedence)
blocked_domains = [
    "*.malicious-site.example",
    "*.phishing.attempt.com"
]

# IP blocklist
blocked_ips = [
    "192.168.100.100/32",
    "203.0.113.0/24"
]

# Maintenance Settings
[maintenance]
# Enable periodic cleanup of old log files (true/false)
cleanup_enabled = true

# Cleanup interval in seconds (default: 86400 = 24 hours)
cleanup_interval_seconds = 86400

# Delete logs older than this many days (default: 15)
log_retention_days = 15

# Secret Redaction Mode (Experimental, Opt-In)
[security]
# WARNING: This is an experimental feature. Requires CONSTRUCT_EXPERIMENT_HIDE_SECRETS=1 env var to function.
# When enabled, prevents LLM agents from seeing raw secrets in mounted project files and environment variables.
# Default: false (disabled)
hide_secrets = false

# Mask style for redacted secrets: "hash" (default) or "fixed"
# - "hash": Shows unique placeholder per secret (CONSTRUCT_REDACTED_<H8>) - better for debugging
# - "fixed": Shows static placeholder (CONSTRUCT_REDACTED) - maximum secrecy
hide_secrets_mask_style = "hash"

# Glob patterns for files that are always scanned for secrets, regardless of heuristics
# Example: ["**/secrets.yml", "**/.env.local"]
hide_secrets_deny_paths = []

# ⚠️  DANGER: Files to NEVER redact (breaks security model, use sparingly!)
# These files will be passed to agents in raw, unredacted form.
# Use ONLY for files that tools must read directly (e.g., ~/.aws/credentials for AWS CLI).
# WARNING: Any secrets in these files WILL be visible to agents.
# Example: ["~/.aws/credentials", "config/tool-specific-secrets.yaml"]
hide_secrets_allow_paths = []

# Environment variable names to pass through unmasked (advanced, use sparingly)
# These vars will be visible to agents in raw form. Example: ["PUBLIC_API_URL", "APP_ENV"]
hide_secrets_passthrough_vars = []

# Emit a session report after each agent run showing scan/redaction statistics
hide_secrets_report = true

# Hide .git directory in merged view (default: true)
# WARNING: Setting to false exposes git history, reflogs, and past commits which may contain secrets
hide_git_dir = true


